<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StickIt</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="widget.css" />
</head>
<body data-theme="dark">
  <div id="app" data-tauri-drag-region>

    <!-- ── Titlebar / Drag Region ──────────────────────────────── -->
    <header id="titlebar" data-tauri-drag-region>
      <div id="title-left" data-tauri-drag-region>
        <span id="app-icon"></span>
        <span id="app-name" data-tauri-drag-region>STICKIT</span>
      </div>
      <div id="title-actions">
        <button id="btn-settings" class="icon-btn" title="Settings">⚙</button>
        <button id="btn-pin" class="icon-btn active" title="Always on top">📌</button>
        <button id="btn-collapse" class="icon-btn" title="Collapse">−</button>
        <!-- hide button intentionally removed -->

      </div>
    </header>

    <!-- ── Body (collapsible) ─────────────────────────────────── -->
    <div id="widget-body" data-tauri-drag-region>

      <!-- Stats bar -->
      <div id="stats-bar">
        <span id="stats-text">0 tasks</span>
        <button id="btn-clear-done" class="text-btn" title="Clear completed">Clear done</button>
      </div>

      <!-- Filter tabs -->
      <!-- <div id="filter-tabs">
        <button class="filter-tab active" data-filter="all" id="tab-all">All</button>
        <button class="filter-tab" data-filter="active" id="tab-active">Active</button>
        <button class="filter-tab" data-filter="done" id="tab-done">Done</button>
      </div> -->

      <!-- Todo list -->
      <ul id="todo-list" role="list" data-tauri-drag-region></ul>

      <!-- Empty state -->
      <div id="empty-state" style="display:none" data-tauri-drag-region>
        <span>✨</span>
        <p>All clear! Add a task.</p>
      </div>

      <!-- Quick-add input -->
      <div id="add-area">
        <div id="priority-picker">
          <button class="prio-btn active" data-prio="1" id="prio-low" title="Low priority">●</button>
          <button class="prio-btn" data-prio="2" id="prio-med" title="Medium priority">●</button>
          <button class="prio-btn" data-prio="3" id="prio-high" title="High priority">●</button>
        </div>
        <input
          id="todo-input"
          type="text"
          placeholder="Add a task…"
          maxlength="120"
          autocomplete="off"
          spellcheck="false"
        />
        <button id="btn-add" class="icon-btn accent" title="Add task">+</button>
      </div>
    </div>

  </div>

  <!-- Context menu for existing todos -->
  <div id="ctx-menu" style="display:none">
    <button id="ctx-edit">✏ Edit</button>
    <button id="ctx-prio-1">● Low</button>
    <button id="ctx-prio-2">● Medium</button>
    <button id="ctx-prio-3">● High</button>
    <div class="ctx-sep"></div>
    <button id="ctx-delete">🗑 Delete</button>
  </div>

  <script src="widget.js" type="module"></script>
</body>
</html>
